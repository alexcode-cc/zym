<!doctype html>
<html is-chrome="true">
  <head>
    <meta charset="UTF-8" />
    <title>zyfun</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 預先加載 MathJax 以支持 markdown-it-mathjax3 -->
    <script>
      // 為 markdown-it-mathjax3 提供 require polyfill
      if (typeof require === 'undefined') {
        window.require = function(id) {
          // 如果是嘗試加載 mathjax，返回全局 MathJax 對象
          if (id && (id.includes('mathjax') || id.includes('MathJax'))) {
            return window.MathJax || {};
          }
          throw new Error('require is not available in renderer process');
        };
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  </head>

  <body>
    <button id="a11y-open-btn" tabindex="1" style="position: fixed; z-index: -1; left: 0px; top: 0px; width: 0px; height: 0px; opacity: 0;">开启读屏标签</button>
    <div id="a11y-live-assertive" aria-live="assertive" style="position: fixed; z-index: -1; left: 0px; top: 0px; width: 0px; height: 0px; opacity: 0;">读屏标签已关闭</div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
